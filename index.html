<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>봉자 베리굿 이모티콘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: 'Jua', sans-serif;
      overflow: hidden;
    }

    .sticker-container {
      position: relative;
      width: min(320px, 88vw);
      aspect-ratio: 320 / 380;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.12));
    }

    /* 텍스트 스타일링 */
    .text-box {
      text-align: center;
      line-height: 1.1;
      margin-bottom: 5px;
      z-index: 10;
    }

    .title-top {
      display: inline-block;
      font-size: 38px;
      color: #ff5277;
      text-shadow:
        -3px -3px 0 #fff,  3px -3px 0 #fff,
        -3px  3px 0 #fff,  3px  3px 0 #fff,
        -6px -6px 0 #fff,  6px -6px 0 #fff,
        -6px  6px 0 #fff,  6px  6px 0 #fff,
        0 4px 6px rgba(0,0,0,0.15);
      letter-spacing: 2px;
      animation: titlePulse 1.6s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.06) rotate(-1.5deg); }
    }

    .title-bottom {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .bubble-letter {
      display: inline-block;
      font-size: 44px;
      color: #ff7a00;
      text-shadow:
        -3px -3px 0 #fff,  3px -3px 0 #fff,
        -3px  3px 0 #fff,  3px  3px 0 #fff,
        -6px -6px 0 #fff,  6px -6px 0 #fff,
        -6px  6px 0 #fff,  6px  6px 0 #fff,
        0 4px 6px rgba(0,0,0,0.15);
      animation: letterBounce 1.1s ease-in-out infinite;
    }
    .bubble-letter:nth-child(1) { animation-delay: 0.00s; }
    .bubble-letter:nth-child(2) { animation-delay: 0.08s; }
    .bubble-letter:nth-child(3) { animation-delay: 0.16s; }
    .bubble-letter:nth-child(4) { animation-delay: 0.24s; }

    @keyframes letterBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-12px) rotate(-6deg); }
      50% { transform: translateY(-16px) rotate(6deg); }
      75% { transform: translateY(0) rotate(0deg); }
    }

    /* 캐릭터 얼굴 SVG 래퍼 */
    .character-box {
      width: 61%;
      aspect-ratio: 240 / 190;
      position: relative;
      filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 4px #ffffff);
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 캐릭터 전체 통통 튀는 움직임 */
    .char-wrap {
      animation: charBounce 1.6s ease-in-out infinite;
      transform-origin: 120px 150px;
    }
    @keyframes charBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 엑셀 아이디어 아이콘 - 머릿속에서 다양하게 샘솟듯 위로 떠오름 */
    .text-box {
      position: relative;
    }
    .idea-wrap {
      position: absolute;
      top: 55%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
    }
    .idea-icon {
      opacity: 0;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
    }

    .icon1 { transform-origin: 20px 92px;  animation: riseFadeA 2.4s ease-in infinite; animation-delay: 0s; }
    .icon2 { transform-origin: 95px 96px;  animation: riseFadeB 2.0s ease-in infinite; animation-delay: 0.3s; }
    .icon3 { transform-origin: 55px 100px; animation: riseFadeA 2.6s ease-in infinite; animation-delay: 0.6s; }
    .icon4 { transform-origin: 75px 105px; animation: riseFadeC 2.3s ease-in infinite; animation-delay: 0.9s; }
    .icon5 { transform-origin: 10px 108px; animation: riseFadeB 2.5s ease-in infinite; animation-delay: 1.2s; }
    .icon6 { transform-origin: 65px 88px;  animation: riseFadeA 2.1s ease-in infinite; animation-delay: 1.5s; }
    .icon7 { transform-origin: 45px 112px; animation: riseFadeC 2.7s ease-in infinite; animation-delay: 1.8s; }
    .icon8 { transform-origin: 88px 114px; animation: riseFadeB 2.2s ease-in infinite; animation-delay: 2.1s; }

    @keyframes riseFadeA {
      0%   { transform: translateY(0) scale(0.5) rotate(-8deg); opacity: 0; }
      15%  { opacity: 1; transform: translateY(-6px) scale(1) rotate(0deg); }
      80%  { opacity: 1; transform: translateY(-46px) scale(1.05) rotate(3deg); }
      100% { transform: translateY(-58px) scale(0.85) rotate(6deg); opacity: 0; }
    }
    @keyframes riseFadeB {
      0%   { transform: translateY(0) scale(0.4) rotate(6deg); opacity: 0; }
      20%  { opacity: 1; transform: translateY(-12px) scale(1.2) rotate(-4deg); }
      50%  { transform: translateY(-32px) scale(0.95) rotate(2deg); }
      80%  { opacity: 1; transform: translateY(-66px) scale(1.1) rotate(4deg); }
      100% { transform: translateY(-80px) scale(0.8) rotate(8deg); opacity: 0; }
    }
    @keyframes riseFadeC {
      0%   { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      15%  { opacity: 1; transform: translateY(-8px) scale(0.9) rotate(-10deg); }
      50%  { transform: translateY(-36px) scale(1.08) rotate(10deg); }
      80%  { opacity: 1; transform: translateY(-56px) scale(1) rotate(-6deg); }
      100% { transform: translateY(-68px) scale(0.85) rotate(4deg); opacity: 0; }
    }

    /* 눈 깜빡임 */
    .eyes {
      animation: blink 3.2s ease-in-out infinite;
      transform-origin: 120px 108px;
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.1); }
      96% { transform: scaleY(1); }
    }

  </style>
</head>
<body>

  <div class="sticker-container">
    <!-- 텍스트 영역 -->
    <div class="text-box">
      <svg class="idea-wrap" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- fx 함수 아이콘 -->
        <g class="idea-icon icon1">
          <rect x="10" y="82" width="20" height="20" rx="5" fill="#217346"/>
          <text x="20" y="96" font-size="11" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" text-anchor="middle">fx</text>
        </g>

        <!-- 시그마(합계) 아이콘 - 크게 -->
        <g class="idea-icon icon2">
          <circle cx="95" cy="96" r="12" fill="#217346"/>
          <text x="95" y="101" font-size="15" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">&#931;</text>
        </g>

        <!-- 표/그리드 아이콘 -->
        <g class="idea-icon icon3">
          <rect x="47" y="91" width="16" height="16" rx="2" fill="#ffffff" stroke="#217346" stroke-width="2"/>
          <line x1="47" y1="96.3" x2="63" y2="96.3" stroke="#217346" stroke-width="1.4"/>
          <line x1="47" y1="101.6" x2="63" y2="101.6" stroke="#217346" stroke-width="1.4"/>
          <line x1="54.7" y1="91" x2="54.7" y2="107" stroke="#217346" stroke-width="1.4"/>
        </g>

        <!-- =SUM() 알약모양 -->
        <g class="idea-icon icon4">
          <rect x="58" y="98" width="42" height="16" rx="8" fill="#ffffff" stroke="#217346" stroke-width="2"/>
          <text x="79" y="109.5" font-size="9" fill="#217346" font-family="Consolas, 'Courier New', monospace" font-weight="bold" text-anchor="middle">=SUM()</text>
        </g>

        <!-- IF 함수 (파랑, 작게) -->
        <g class="idea-icon icon5">
          <rect x="2" y="100" width="16" height="16" rx="4" fill="#2b6cb0"/>
          <text x="10" y="111.5" font-size="8" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-weight="bold" text-anchor="middle">IF</text>
        </g>

        <!-- % 아이콘 (주황, 작게) -->
        <g class="idea-icon icon6">
          <circle cx="65" cy="82" r="8" fill="#e67e22"/>
          <text x="65" y="86" font-size="9" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">%</text>
        </g>

        <!-- A1 셀 참조 (회색 알약, 크게) -->
        <g class="idea-icon icon7">
          <rect x="30" y="102" width="30" height="16" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
          <text x="45" y="113.5" font-size="9" fill="#607d8b" font-family="Consolas, 'Courier New', monospace" font-weight="bold" text-anchor="middle">A1</text>
        </g>

        <!-- #REF! 에러 태그 (빨강, 아주 작게, 재미 포인트) -->
        <g class="idea-icon icon8">
          <rect x="78" y="106" width="24" height="12" rx="4" fill="#e53935"/>
          <text x="90" y="115" font-size="6.5" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-weight="bold" text-anchor="middle">#REF!</text>
        </g>
      </svg>
      <div class="title-top">전산녀</div>
      <div class="title-bottom">
        <span class="bubble-letter">봉</span><span class="bubble-letter">자</span>
      </div>
    </div>

    <!-- 얼굴 및 제스처 영역 (SVG 벡터) -->
    <div class="character-box">
      <svg viewBox="0 0 240 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g class="char-wrap">

          <!-- 양쪽 리본 (단발머리 장식) -->
          <path d="M 45 42 C 30 30 25 55 35 65 C 25 75 45 90 55 75 C 60 65 55 50 45 42 Z" fill="#e63956" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="48" cy="62" r="5" fill="#c02640" stroke="#222" stroke-width="3"/>

          <path d="M 195 42 C 210 30 215 55 205 65 C 215 75 195 90 185 75 C 180 65 185 50 195 42 Z" fill="#e63956" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="192" cy="62" r="5" fill="#c02640" stroke="#222" stroke-width="3"/>

          <!-- 핑크색 단발머리 뒷면/베이스 (블런트컷 단발) -->
          <path d="M 38 112 C 32 55 70 22 120 22 C 170 22 208 55 202 112 C 200 136 194 156 182 162 C 172 167 164 165 163 150 L 163 128 L 77 128 L 77 150 C 76 165 68 167 58 162 C 46 156 40 136 38 112 Z" fill="#ff7a90" stroke="#222" stroke-width="5" stroke-linejoin="round"/>

          <!-- 얼굴 피부 -->
          <path d="M 50 115 C 50 75 80 55 120 55 C 160 55 190 75 190 115 C 190 155 165 170 120 170 C 75 170 50 155 50 115 Z" fill="#ffeedd" stroke="#222" stroke-width="5" stroke-linejoin="round"/>

          <!-- 앞머리 뱅 -->
          <path d="M 60 65 C 80 85 95 80 120 65 C 145 80 160 85 180 65 C 175 50 150 40 120 40 C 90 40 65 50 60 65 Z" fill="#ff7a90" stroke="#222" stroke-width="4"/>

          <!-- 볼터치 -->
          <ellipse cx="75" cy="122" rx="14" ry="9" fill="#ff9999" />
          <ellipse cx="165" cy="122" rx="14" ry="9" fill="#ff9999" />

          <!-- 눈 (반짝이는 눈망울) -->
          <g class="eyes">
            <ellipse cx="92" cy="108" rx="6" ry="8" fill="#222" />
            <circle cx="90" cy="105" r="2.5" fill="#fff" />
            <ellipse cx="148" cy="108" rx="6" ry="8" fill="#222" />
            <circle cx="146" cy="105" r="2.5" fill="#fff" />
          </g>

          <!-- 똑똑해 보이는 노란 안경 -->
          <g class="glasses">
            <circle cx="92" cy="108" r="15" fill="#fff9db" fill-opacity="0.35" stroke="#ffd100" stroke-width="4"/>
            <circle cx="148" cy="108" r="15" fill="#fff9db" fill-opacity="0.35" stroke="#ffd100" stroke-width="4"/>
            <line x1="107" y1="108" x2="133" y2="108" stroke="#ffd100" stroke-width="4" stroke-linecap="round"/>
            <line x1="77" y1="106" x2="67" y2="101" stroke="#ffd100" stroke-width="4" stroke-linecap="round"/>
            <line x1="163" y1="106" x2="173" y2="101" stroke="#ffd100" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="87" cy="103" rx="3" ry="2" fill="#ffffff" opacity="0.7"/>
            <ellipse cx="143" cy="103" rx="3" ry="2" fill="#ffffff" opacity="0.7"/>
          </g>

          <!-- 코 -->
          <circle cx="120" cy="114" r="2" fill="#d99879" />

          <!-- 활짝 웃는 입 -->
          <ellipse cx="120" cy="134" rx="25" ry="15" fill="#c02640" stroke="#222" stroke-width="3"/>
          <ellipse cx="120" cy="142" rx="13" ry="6" fill="#ff859a"/>

        </g>
      </svg>
    </div>
  </div>

</body>
</html>
