<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>봉자 베리굿 이모티콘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f7ff;
      font-family: 'Jua', sans-serif;
    }

    .sticker-container {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.12));
    }

    /* 텍스트 스타일링 */
    .text-box {
      text-align: center;
      line-height: 1.1;
      margin-bottom: 5px;
      z-index: 10;
    }

    .title-top {
      font-size: 38px;
      color: #ff5277;
      text-shadow: 
        -3px -3px 0 #fff,  3px -3px 0 #fff,
        -3px  3px 0 #fff,  3px  3px 0 #fff,
        -6px -6px 0 #fff,  6px -6px 0 #fff,
        -6px  6px 0 #fff,  6px  6px 0 #fff,
        0 4px 6px rgba(0,0,0,0.15);
      letter-spacing: 2px;
    }

    .title-bottom {
      font-size: 44px;
      color: #ff7a00;
      text-shadow: 
        -3px -3px 0 #fff,  3px -3px 0 #fff,
        -3px  3px 0 #fff,  3px  3px 0 #fff,
        -6px -6px 0 #fff,  6px -6px 0 #fff,
        -6px  6px 0 #fff,  6px  6px 0 #fff,
        0 4px 6px rgba(0,0,0,0.15);
      letter-spacing: 1px;
    }

    /* 캐릭터 얼굴 SVG 래퍼 */
    .character-box {
      width: 220px;
      height: 200px;
      position: relative;
      filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 4px #ffffff);
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 반짝이 장식 애니메이션 */
    .sparkle {
      animation: float 2s infinite ease-in-out alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-6px) scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="sticker-container">
    <!-- 텍스트 영역 -->
    <div class="text-box">
      <div class="title-top">봉자</div>
      <div class="title-bottom">베리굿!</div>
    </div>

    <!-- 얼굴 및 제스처 영역 (SVG 벡터) -->
    <div class="character-box">
      <svg viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 배경 반짝이 효과 -->
        <g class="sparkle">
          <path d="M 20 50 Q 25 35 30 50 Q 45 55 30 60 Q 25 75 20 60 Q 5 55 20 50 Z" fill="#ffd100" />
          <path d="M 215 60 Q 220 48 225 60 Q 237 65 225 70 Q 220 82 215 70 Q 203 65 215 60 Z" fill="#ffd100" />
        </g>

        <!-- 양쪽 리본 (단발머리 장식) -->
        <path d="M 45 42 C 30 30 25 55 35 65 C 25 75 45 90 55 75 C 60 65 55 50 45 42 Z" fill="#e63956" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="48" cy="62" r="5" fill="#c02640" stroke="#222" stroke-width="3"/>

        <path d="M 195 42 C 210 30 215 55 205 65 C 215 75 195 90 185 75 C 180 65 185 50 195 42 Z" fill="#e63956" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="192" cy="62" r="5" fill="#c02640" stroke="#222" stroke-width="3"/>

        <!-- 핑크색 단발머리 뒷면/베이스 -->
        <path d="M 35 110 C 25 50 65 20 120 20 C 175 20 215 50 205 110 C 200 145 185 160 170 160 C 160 160 155 150 120 150 C 85 150 80 160 70 160 C 55 160 40 145 35 110 Z" fill="#ff7a90" stroke="#222" stroke-width="5" stroke-linejoin="round"/>

        <!-- 얼굴 피부 -->
        <path d="M 50 115 C 50 75 80 55 120 55 C 160 55 190 75 190 115 C 190 155 165 170 120 170 C 75 170 50 155 50 115 Z" fill="#ffeedd" stroke="#222" stroke-width="5" stroke-linejoin="round"/>

        <!-- 앞머리 뱅 -->
        <path d="M 60 65 C 80 85 95 80 120 65 C 145 80 160 85 180 65 C 175 50 150 40 120 40 C 90 40 65 50 60 65 Z" fill="#ff7a90" stroke="#222" stroke-width="4"/>

        <!-- 볼터치 -->
        <ellipse cx="75" cy="122" rx="14" ry="9" fill="#ff9999" />
        <ellipse cx="165" cy="122" rx="14" ry="9" fill="#ff9999" />

        <!-- 눈 (반짝이는 눈망울) -->
        <ellipse cx="92" cy="108" rx="6" ry="8" fill="#222" />
        <circle cx="90" cy="105" r="2.5" fill="#fff" />
        <ellipse cx="148" cy="108" rx="6" ry="8" fill="#222" />
        <circle cx="146" cy="105" r="2.5" fill="#fff" />

        <!-- 코 -->
        <circle cx="120" cy="114" r="2" fill="#d99879" />

        <!-- 활짝 웃는 입 -->
        <path d="M 108 124 Q 120 130 132 124 Q 120 150 108 124 Z" fill="#e63956" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 112 136 Q 120 130 128 136 Q 120 148 112 136 Z" fill="#ff859a"/>

        <!-- 양손 엄지척 (따봉) -->
        <!-- 왼손 -->
        <g>
          <path d="M 52 145 C 45 130 55 120 62 125 C 68 130 68 140 68 148 C 75 148 78 155 75 162 C 70 172 50 175 42 165 C 38 158 45 150 52 145 Z" fill="#ffeedd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
          <line x1="58" y1="140" x2="68" y2="146" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 오른손 -->
        <g>
          <path d="M 188 145 C 195 130 185 120 178 125 C 172 130 172 140 172 148 C 165 148 162 155 165 162 C 170 172 190 175 198 165 C 202 158 195 150 188 145 Z" fill="#ffeedd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
          <line x1="182" y1="140" x2="172" y2="146" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 가운데 작은 하트 장식 -->
        <path d="M 120 162 C 120 162 110 152 105 158 C 100 164 106 172 120 180 C 134 172 140 164 135 158 C 130 152 120 162 120 162 Z" fill="#ff4d6d" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</body>
</html>
